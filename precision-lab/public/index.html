<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precision Lab Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>
    <main class="auth-layout">
      <section class="brand-panel">
        <p class="eyebrow">Precision Lab</p>
        <h1>Secure Access, Sharp Interface</h1>
        <p>
          Create an account or sign in to continue to your dashboard. This demo uses
          JWT-based authentication with hashed passwords.
        </p>
      </section>

      <section class="card">
        <div class="tab-row" role="tablist" aria-label="Authentication mode">
          <button class="tab active" id="registerTab" data-mode="register" role="tab" aria-selected="true">
            Register
          </button>
          <button class="tab" id="loginTab" data-mode="login" role="tab" aria-selected="false">
            Login
          </button>
        </div>

        <form id="authForm" class="form" novalidate>
          <div id="nameField" class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Ada Lovelace" autocomplete="name" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              autocomplete="current-password"
              required
            />
          </div>

          <button id="submitButton" class="submit-button" type="submit">Create Account</button>
          <p id="formMessage" class="message" aria-live="polite"></p>
        </form>

        <div id="profileCard" class="profile-card hidden">
          <h2>Authenticated</h2>
          <p id="profileText">You are logged in.</p>
          <button id="logoutButton" class="secondary-button" type="button">Log Out</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
